<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⑨</title>
<style>
body{font-family:Arial,sans-serif;background:#e6f7ff;color:#0066cc;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh}.container{background:white;border-radius:10px;padding:20px;width:100%;max-width:500px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}h1{color:#003366;text-align:center;margin-bottom:15px}input{width:100%;padding:10px;margin:10px 0;border:2px solid #66b3ff;border-radius:5px;font-size:16px}button{background:#3399ff;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:16px;width:100%;margin:10px 0}button:hover{background:#0077e6}#result{margin-top:20px;padding:15px;background:#f5fbff;border-radius:5px;border-left:4px solid #3399ff;word-break:break-word}.nine{color:#e91e63;font-weight:bold}.baka{text-align:center;margin:10px 0;font-size:20px}
</style>
</head>
<body>
<div class="container">
<div class="baka">(ﾉ｀Д´)ﾉ バカバカ！</div>
<h1>⑨</h1>
<input type="number" id="n" placeholder="数字" value="99999">
<button onclick="x()">バカ！</button>
<div id="r"></div>
</div>

<script>
function x(){
let y=document.getElementById("n").value;
let z=parseInt(y);
let w=document.getElementById("r");
if(isNaN(z)){w.innerHTML="バカ！(╯°□°)╯︵ ┻━┻";return}
w.innerHTML=f(z)+"<br><br>バカ！ヽ(｀⌒´)ノ"}
function f(n){
if(n===0)return"<span class='nine'>⑨</span>-<span class='nine'>⑨</span>";
if(n===1)return"(<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>)";
if(/^9+$/.test(n.toString()))return"<span class='nine'>"+"⑨".repeat(n.toString().length)+"</span>";
if(n===9)return"<span class='nine'>⑨</span>";
if(n<0)return`-(${f(-n)})`;
if(n%9===0)return`<span class='nine'>⑨</span>×${f(n/9)}`;
let a=n%9;
let b=Math.floor(n/9);
if(b>0)return`(<span class='nine'>⑨</span>×${f(b)})+${f(a)}`;
switch(n){
case 2:return"(<span class='nine'>⑨</span>+<span class='nine'>⑨</span>)÷<span class='nine'>⑨</span>";
case 3:return"(<span class='nine'>⑨</span>+<span class='nine'>⑨</span>+<span class='nine'>⑨</span>)÷<span class='nine'>⑨</span>";
case 4:return"<span class='nine'>⑨</span>-(<span class='nine'>⑨</span>+<span class='nine'>⑨</span>+<span class='nine'>⑨</span>)÷<span class='nine'>⑨</span>";
case 5:return"<span class='nine'>⑨</span>-(<span class='nine'>⑨</span>+<span class='nine'>⑨</span>)÷<span class='nine'>⑨</span>";
case 6:return"<span class='nine'>⑨</span>-<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>";
case 7:return"<span class='nine'>⑨</span>-(<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>+<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>)";
case 8:return"<span class='nine'>⑨</span>-<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>÷<span class='nine'>⑨</span>";
default:return n}}
</script>
</body>
</html>
